# Workflow: Nightly Cache Recreation
#
# Recreates all Bazel caches (disk + repository) from scratch.
#
# Phase 1 — Fetch (sequential): Each job runs with --nobuild to populate
# the repository cache without compiling. Jobs run sequentially so the
# repo cache accumulates across configs.
#
# Phase 2 — Build (parallel): All jobs run the actual builds in parallel,
# restoring the complete repo cache from Phase 1. Each job saves its own
# disk cache.
#
# Can also be triggered manually via workflow_dispatch.

name: Nightly Cache Recreation

on:
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MAX_RETRIES: 10

jobs:
  # ======================================================================
  # Phase 1: Fetch dependencies (sequential, --nobuild)
  # Populates the shared repository cache without compiling.
  # ======================================================================
  fetch-host-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/00_infrastructure/bazel_job
        with:
          disk-cache: build_and_test_host
          cache-mode: "recreate"
      - name: Fetch dependencies (--nobuild)
        shell: bash
        run: |
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"
            if bazel build --nobuild //... && (cd examples && bazel build --nobuild //...); then
              echo "Fetch succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Attempt ${attempt} failed, retrying..."
          done
          echo "::error::All ${MAX_RETRIES} attempts failed."
          exit 1

  fetch-tsan:
    needs: fetch-host-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/00_infrastructure/bazel_job
        with:
          disk-cache: build_and_test_tsan
          cache-mode: "recreate-update"
      - name: Fetch dependencies (--nobuild, tsan)
        shell: bash
        run: |
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"
            if bazel build --nobuild --config=tsan //...; then
              echo "Fetch succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Attempt ${attempt} failed, retrying..."
          done
          echo "::error::All ${MAX_RETRIES} attempts failed."
          exit 1

  fetch-asan:
    needs: fetch-tsan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/00_infrastructure/bazel_job
        with:
          disk-cache: build_and_test_asan_ubsan_lsan
          cache-mode: "recreate-update"
      - name: Fetch dependencies (--nobuild, asan_ubsan_lsan)
        shell: bash
        run: |
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"
            if bazel build --nobuild --config=asan_ubsan_lsan //...; then
              echo "Fetch succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Attempt ${attempt} failed, retrying..."
          done
          echo "::error::All ${MAX_RETRIES} attempts failed."
          exit 1

  fetch-clang-tidy:
    needs: fetch-asan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/00_infrastructure/bazel_job
        with:
          disk-cache: clang_tidy
          cache-mode: "recreate-update"
      - name: Fetch dependencies (--nobuild, clang-tidy)
        shell: bash
        run: |
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"
            if bazel build --nobuild --config=clang-tidy //...; then
              echo "Fetch succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Attempt ${attempt} failed, retrying..."
          done
          echo "::error::All ${MAX_RETRIES} attempts failed."
          exit 1

  fetch-coverage:
    needs: fetch-clang-tidy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/00_infrastructure/bazel_job
        with:
          disk-cache: coverage_report
          cache-mode: "recreate-update"
      - name: Fetch dependencies (--nobuild, coverage)
        shell: bash
        run: |
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"
            if bazel build --nobuild //...; then
              echo "Fetch succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Attempt ${attempt} failed, retrying..."
          done
          echo "::error::All ${MAX_RETRIES} attempts failed."
          exit 1

  fetch-codeql:
    needs: fetch-coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/00_infrastructure/bazel_job
        with:
          disk-cache: ""
          cache-mode: "recreate-update"
      - name: Fetch dependencies (--nobuild, codeql)
        shell: bash
        run: |
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"
            if bazel build --nobuild //...; then
              echo "Fetch succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Attempt ${attempt} failed, retrying..."
          done
          echo "::error::All ${MAX_RETRIES} attempts failed."
          exit 1

  fetch-qnx:
    needs: fetch-codeql
    uses: ./.github/workflows/build_and_test_qnx.yml
    with:
      cache_mode: "recreate-update"
      fetch_only: "true"
      max_retries: "10"
    secrets:
      SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
      SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
      SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
    permissions:
      contents: read
      actions: write
      pull-requests: read

  # ======================================================================
  # Phase 2: Build (parallel)
  # All jobs restore the repo cache from Phase 1 and build their disk cache.
  # ======================================================================
  build-host:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/build-and-test-x86_64-gcc15
        with:
          cache-mode: "recreate-update"

  build-tsan:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/thread-sanitizer
        with:
          cache-mode: "recreate-update"

  build-asan:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/address-sanitizer
        with:
          cache-mode: "recreate-update"

  build-clang-tidy:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/clang-tidy
        with:
          cache-mode: "recreate-update"

  build-coverage:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/coverage-report
        with:
          cache-mode: "recreate-update"

  build-codeql:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/codeql
        with:
          cache-mode: "recreate-update"

  build-qnx:
    needs: fetch-qnx
    uses: ./.github/workflows/build_and_test_qnx.yml
    with:
      cache_mode: "recreate-update"
      max_retries: "10"
    secrets:
      SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
      SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
      SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
    permissions:
      contents: read
      actions: write
      pull-requests: read
