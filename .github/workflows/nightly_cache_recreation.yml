# Workflow: Nightly Cache Recreation
#
# Recreates all Bazel caches (disk + repository) from scratch by running
# each CI workflow sequentially. The repository cache accumulates across jobs:
#   - First job: starts empty (recreate mode)
#   - Subsequent jobs: restore repo cache from previous job (recreate-update mode)
#   - Every job saves repo cache under content-hash key and cleans up old entries
#
# Can also be triggered manually via workflow_dispatch.

name: Nightly Cache Recreation

on:
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recreate-host-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/build-and-test-host
        with:
          cache-mode: "recreate"

  recreate-tsan:
    needs: recreate-host-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/thread-sanitizer
        with:
          cache-mode: "recreate-update"

  recreate-asan:
    needs: recreate-tsan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/address-sanitizer
        with:
          cache-mode: "recreate-update"

  recreate-clang-tidy:
    needs: recreate-asan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/clang-tidy
        with:
          cache-mode: "recreate-update"

  recreate-coverage:
    needs: recreate-clang-tidy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/coverage-report
        with:
          cache-mode: "recreate-update"

  recreate-codeql:
    needs: recreate-coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/codeql
        with:
          cache-mode: "recreate-update"

  recreate-qnx:
    needs: recreate-codeql
    uses: ./.github/workflows/build_and_test_qnx.yml
    with:
      cache_mode: "recreate-update"
    secrets:
      SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
      SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
      SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
    permissions:
      contents: read
      actions: write
      pull-requests: read
