# Workflow: Nightly Cache Recreation
#
# Recreates all Bazel caches (disk + repository) from scratch.
#
# Phase 1 — Fetch (sequential): Each job runs with --nobuild to populate
# the repository cache without compiling. Jobs run sequentially so the
# repo cache accumulates across configs.
#
# Phase 2 — Build (parallel): All jobs run the actual builds in parallel,
# restoring the complete repo cache from Phase 1. Each job saves its own
# disk cache.
#
# Can also be triggered manually via workflow_dispatch.

name: Nightly Cache Recreation

on:
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ======================================================================
  # Phase 1: Fetch dependencies (sequential, --nobuild)
  # Populates the shared repository cache without compiling.
  # ======================================================================
  fetch-host-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/build-and-test-x86_64-gcc15
        with:
          cache-mode: "recreate"
          fetch-only: "true"

  fetch-tsan:
    needs: fetch-host-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/thread-sanitizer
        with:
          cache-mode: "recreate-update"
          fetch-only: "true"

  fetch-asan:
    needs: fetch-tsan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/address-sanitizer
        with:
          cache-mode: "recreate-update"
          fetch-only: "true"

  fetch-clang-tidy:
    needs: fetch-asan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/clang-tidy
        with:
          cache-mode: "recreate-update"
          fetch-only: "true"

  fetch-coverage:
    needs: fetch-clang-tidy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/coverage-report
        with:
          cache-mode: "recreate-update"
          fetch-only: "true"

  fetch-codeql:
    needs: fetch-coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/codeql
        with:
          cache-mode: "recreate-update"
          fetch-only: "true"

  fetch-qnx:
    needs: fetch-codeql
    uses: ./.github/workflows/build_and_test_qnx.yml
    with:
      cache_mode: "recreate-update"
      fetch_only: "true"
    secrets:
      SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
      SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
      SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
    permissions:
      contents: read
      actions: write
      pull-requests: read

  # ======================================================================
  # Phase 2: Build (parallel)
  # All jobs restore the repo cache from Phase 1 and build their disk cache.
  # ======================================================================
  build-host:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/build-and-test-x86_64-gcc15
        with:
          cache-mode: "recreate-update"

  build-tsan:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/thread-sanitizer
        with:
          cache-mode: "recreate-update"

  build-asan:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/address-sanitizer
        with:
          cache-mode: "recreate-update"

  build-clang-tidy:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/clang-tidy
        with:
          cache-mode: "recreate-update"

  build-coverage:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/coverage-report
        with:
          cache-mode: "recreate-update"

  build-codeql:
    needs: fetch-qnx
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/codeql
        with:
          cache-mode: "recreate-update"

  build-qnx:
    needs: fetch-qnx
    uses: ./.github/workflows/build_and_test_qnx.yml
    with:
      cache_mode: "recreate-update"
    secrets:
      SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
      SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
      SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
    permissions:
      contents: read
      actions: write
      pull-requests: read
