# Orchestrator: PR Quality Gates (Host)
#
# Runs all host-platform quality checks in parallel by calling thin
# callable workflows. Each job's logic is defined in exactly one place
# (the callable workflow); this file only arranges execution.
#
# Also callable via workflow_call (used by automated_release).

name: PR Quality (Host)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      recreate_cache:
        description: "Recreate caches from scratch (nightly)"
        required: false
        type: boolean
        default: false
      recreate_cache_mode:
        description: "Nightly cache mode: recreate or recreate-update"
        required: false
        type: string
        default: "recreate"

concurrency:
  group: pr-quality-host-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-test:
    uses: ./.github/workflows/build_and_test_host.yml
    with:
      recreate_cache: ${{ inputs.recreate_cache || false }}
      recreate_cache_mode: ${{ inputs.recreate_cache_mode || 'recreate' }}
    permissions:
      contents: read
      actions: write

  tsan:
    uses: ./.github/workflows/thread_sanitizer.yml
    with:
      recreate_cache: ${{ inputs.recreate_cache || false }}
      recreate_cache_mode: ${{ inputs.recreate_cache_mode || 'recreate' }}
    permissions:
      contents: read
      actions: write

  asan:
    uses: ./.github/workflows/address_sanitizer.yml
    with:
      recreate_cache: ${{ inputs.recreate_cache || false }}
      recreate_cache_mode: ${{ inputs.recreate_cache_mode || 'recreate' }}
    permissions:
      contents: read
      actions: write

  clang-tidy:
    uses: ./.github/workflows/clang_tidy.yml
    with:
      recreate_cache: ${{ inputs.recreate_cache || false }}
      recreate_cache_mode: ${{ inputs.recreate_cache_mode || 'recreate' }}
    permissions:
      contents: read
      actions: write
