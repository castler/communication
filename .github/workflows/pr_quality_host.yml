# Workflow: PR Quality Gates (Host)
#
# Runs all host-platform quality checks as parallel jobs:
#   - build-and-test: Full build + test + examples
#   - tsan: Thread sanitizer
#   - asan: Address, undefined behavior, and leak sanitizers
#   - clang-tidy: Static analysis (blocks PRs on errors in changed files)
#
# Callers can selectively run a subset of jobs via the 'jobs' input.

name: PR Quality (Host)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      recreate_cache:
        description: "Recreate caches from scratch (nightly). Skips restore, saves new cache."
        required: false
        type: boolean
        default: false
      recreate_cache_mode:
        description: "Nightly cache mode: recreate (first job, no restore) or recreate-update (subsequent, restores repo from previous)"
        required: false
        type: string
        default: "recreate"
      jobs:
        description: "Comma-separated list of jobs to run. Default (empty): all jobs."
        required: false
        type: string
        default: ""
    outputs:
      clang-tidy-artifact-name:
        description: "Name of the clang-tidy findings artifact"
        value: ${{ jobs.clang-tidy.outputs.artifact-name }}
      clang-tidy-errors:
        description: "Total clang-tidy error count"
        value: ${{ jobs.clang-tidy.outputs.errors }}
      clang-tidy-warnings:
        description: "Total clang-tidy warning count"
        value: ${{ jobs.clang-tidy.outputs.warnings }}
      clang-tidy-conclusion:
        description: "Clang-tidy job conclusion: success or failure"
        value: ${{ jobs.clang-tidy.outputs.conclusion }}

permissions:
  contents: read
  actions: write

concurrency:
  group: pr-quality-host-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CACHE_MODE: >-
    ${{
      (inputs.recreate_cache || false) == true && (inputs.recreate_cache_mode || 'recreate') ||
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'read-only' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'update-disk' ||
      'disabled'
    }}

jobs:
  # --------------------------------------------------------------------
  # Job 1: Build & Test (host)
  # --------------------------------------------------------------------
  build-and-test:
    if: ${{ !inputs.jobs || contains(inputs.jobs, 'build-and-test') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup and run
        uses: ./.github/actions/bazel-job
        with:
          disk-cache: build_and_test_host
          cache-mode: ${{ env.CACHE_MODE }}
          commands: |
            bazel build //...
            bazel test //... --build_tests_only
            cd examples && bazel build //... && bazel mod deps --lockfile_mode=update

  # --------------------------------------------------------------------
  # Job 2: Thread Sanitizer
  # --------------------------------------------------------------------
  tsan:
    if: ${{ !inputs.jobs || contains(inputs.jobs, 'tsan') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup and run
        uses: ./.github/actions/bazel-job
        with:
          disk-cache: build_and_test_tsan
          cache-mode: ${{ env.CACHE_MODE }}
          commands: "bazel test --config=tsan //... --build_tests_only"

  # --------------------------------------------------------------------
  # Job 3: Address / UB / Leak Sanitizer
  # --------------------------------------------------------------------
  asan:
    if: ${{ !inputs.jobs || contains(inputs.jobs, 'asan') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup and run
        uses: ./.github/actions/bazel-job
        with:
          disk-cache: build_and_test_asan_ubsan_lsan
          cache-mode: ${{ env.CACHE_MODE }}
          commands: "bazel test --config=asan_ubsan_lsan //... --build_tests_only"

  # --------------------------------------------------------------------
  # Job 4: Clang-Tidy
  # --------------------------------------------------------------------
  clang-tidy:
    if: ${{ !inputs.jobs || contains(inputs.jobs, 'clang-tidy') }}
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: clang-tidy-findings
      errors: ${{ steps.findings.outputs.errors }}
      warnings: ${{ steps.findings.outputs.warnings }}
      conclusion: ${{ steps.set-conclusion.outputs.conclusion }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Free Disk Space (Ubuntu)
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4

      - name: Restore Bazel caches
        uses: ./.github/actions/bazel-cache-restore
        with:
          mode: ${{ env.CACHE_MODE }}
          disk-cache-name: clang_tidy

      - name: Allow linux-sandbox
        uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@f89865691445b60e9229c36adb1c37b675e1ca85

      - name: Run clang-tidy via Bazel
        id: run-clang-tidy
        continue-on-error: true
        run: |
          bazel test --config=clang-tidy //... \
            2>&1 | tee clang_tidy_raw.log

      - name: Collect findings
        id: findings
        run: |
          # aspect_rules_lint writes one .out file per target under bazel-bin.
          # -L is needed because bazel-bin is a symlink.
          ERRORS=$(find -L bazel-bin -name "*.AspectRulesLintClangTidy.out" 2>/dev/null \
            | xargs cat 2>/dev/null \
            | grep -c "error:" || true)
          WARNINGS=$(find -L bazel-bin -name "*.AspectRulesLintClangTidy.out" 2>/dev/null \
            | xargs cat 2>/dev/null \
            | grep -c "warning:" || true)
          TOTAL=$((ERRORS + WARNINGS))

          # Scope blocking errors to C++ files changed in this PR / merge-group
          CHANGED_CPP=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null \
            | grep -E '\.(cpp|h|cc|cxx|hpp)$' || true)

          if [[ -z "$CHANGED_CPP" ]]; then
            ERRORS_BLOCKING=0
          else
            PATTERN=$(echo "$CHANGED_CPP" | tr '\n' '|' | sed 's/|$//')
            ERRORS_BLOCKING=$(find -L bazel-bin -name "*.AspectRulesLintClangTidy.out" 2>/dev/null \
              | xargs cat 2>/dev/null \
              | grep -E "(${PATTERN})" \
              | grep -c "error:" || true)
          fi

          echo "errors=${ERRORS}"                   >> $GITHUB_OUTPUT
          echo "warnings=${WARNINGS}"               >> $GITHUB_OUTPUT
          echo "total=${TOTAL}"                     >> $GITHUB_OUTPUT
          echo "errors_blocking=${ERRORS_BLOCKING}" >> $GITHUB_OUTPUT

          # ── Write full findings and errors-only files for artifact ────────
          find -L bazel-bin -name "*.AspectRulesLintClangTidy.out" 2>/dev/null \
            | xargs cat 2>/dev/null > clang_tidy_findings.txt || true

          if [[ ! -s clang_tidy_findings.txt ]]; then
            {
              echo "No clang-tidy findings were produced for this run."
              echo "errors=${ERRORS} warnings=${WARNINGS} total=${TOTAL}"
            } > clang_tidy_findings.txt
          fi

          grep "error:" clang_tidy_findings.txt > clang_tidy_errors.txt || true

          # ── Job summary ──────────────────────────────────────────────────
          {
            echo "## Clang-Tidy Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| :x: Errors | **${ERRORS}** |"
            echo "| :warning: Warnings | **${WARNINGS}** |"
            echo "| Total | **${TOTAL}** |"
            if [[ "${ERRORS_BLOCKING}" -gt 0 ]]; then
              echo ""
              echo "> :x: **Check failed** — clang-tidy errors found in changed files. Fix before merging."
              echo ""
              echo "### First 20 errors in changed files"
              echo '```'
              head -20 clang_tidy_errors.txt || true
              echo '```'
            else
              echo ""
              echo "> :white_check_mark: **Check passed** — no clang-tidy errors in changed files."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clang-tidy findings as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-findings
          path: |
            clang_tidy_findings.txt
            clang_tidy_errors.txt
            clang_tidy_raw.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail check if clang-tidy errors found in changed files
        if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && steps.findings.outputs.errors_blocking != '0'
        run: |
          echo "::error::Clang-tidy found ${{ steps.findings.outputs.errors_blocking }} error(s) in changed files. See the 'clang-tidy-findings' artifact for details."
          echo ""
          echo "=== Clang-tidy errors ==="
          cat clang_tidy_errors.txt || true
          exit 1

      - name: Set conclusion
        id: set-conclusion
        if: always()
        run: |
          if [[ "${{ steps.run-clang-tidy.outcome }}" == "success" ]]; then
            echo "conclusion=success" >> $GITHUB_OUTPUT
          else
            echo "conclusion=failure" >> $GITHUB_OUTPUT
          fi

      - name: Save Bazel caches
        if: always()
        uses: ./.github/actions/bazel-cache-save
        with:
          mode: ${{ env.CACHE_MODE }}
          disk-cache-name: clang_tidy
