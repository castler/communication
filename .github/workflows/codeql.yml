name: CodeQL Analysis

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:  # Allow maintainers to trigger manually when needed
  workflow_call:
    inputs:
      recreate_cache:
        description: "Recreate caches from scratch (nightly). Skips restore, saves new cache."
        required: false
        type: boolean
        default: false
      recreate_cache_mode:
        description: "Nightly cache mode: recreate (first job, no restore) or recreate-update (subsequent, restores repo from previous)"
        required: false
        type: string
        default: "recreate"
    outputs:
      artifact-name:
        description: Name of the uploaded CSV artifact
        value: codeql-csv-results
      conclusion:
        description: Job conclusion (success/failure)
        value: ${{ jobs.run-codeql.result }}

permissions:
  contents: read
  security-events: write  # Required to upload SARIF results to GitHub Code Scanning

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-progress CodeQL run; it takes hours

env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CACHE_MODE: >-
    ${{
      inputs.recreate_cache == true && inputs.recreate_cache_mode ||
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'read-only' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'update-disk' ||
      'disabled'
    }}

jobs:
  run-codeql:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4

      - name: Restore Bazel caches
        uses: ./.github/actions/bazel-cache-restore
        with:
          mode: ${{ env.CACHE_MODE }}
          disk-cache-name: codeql

      - name: Allow linux-sandbox
        uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@f89865691445b60e9229c36adb1c37b675e1ca85

      - name: Create CodeQL database
        run: |
          bazel run //quality/static_analysis:codeql_lint -- \
            --output-dir /tmp/codeql-results \
            --output-prefix codeql-nightly \
            --target //score/message_passing //score/mw/com

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/codeql-results/codeql-nightly.sarif
          category: codeql-nightly

      - name: Upload CSV results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-csv-results
          path: /tmp/codeql-results/codeql-nightly.csv
          retention-days: 30

      - name: Save Bazel caches
        if: always()
        uses: ./.github/actions/bazel-cache-save
        with:
          mode: ${{ env.CACHE_MODE }}
          disk-cache-name: codeql
