# Orchestrator: PR Quality Gates (Host)
#
# Runs all host-platform quality checks in parallel. Each job is a
# reusable workflow (single source of truth); this workflow only
# arranges execution.
#
# Also callable via workflow_call (used by automated_release).

name: PR Quality (Host)

on:
#  push:
#    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pr-quality-host-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-test:
    uses: ./.github/workflows/_build_and_test.yml
    permissions:
      contents: read
      actions: write

  tsan:
    uses: ./.github/workflows/_thread_sanitizer.yml
    permissions:
      contents: read
      actions: write

  asan:
    uses: ./.github/workflows/_address_sanitizer.yml
    permissions:
      contents: read
      actions: write

  clang-tidy:
    uses: ./.github/workflows/_clang_tidy.yml
    permissions:
      contents: read
      actions: write

