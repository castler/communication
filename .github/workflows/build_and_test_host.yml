# Orchestrator: PR Quality Gates (Host)
#
# Runs all host-platform quality checks in parallel. Each job's logic is
# defined as a composite action (single source of truth); this workflow
# only arranges execution.
#
# Also callable via workflow_call (used by automated_release).

name: PR Quality (Host)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pr-quality-host-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/build-and-test-x86_64-gcc15

  tsan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/thread-sanitizer

  asan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/address-sanitizer

  clang-tidy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      artifact-name: ${{ steps.run.outputs.artifact-name }}
      errors: ${{ steps.run.outputs.errors }}
      warnings: ${{ steps.run.outputs.warnings }}
      conclusion: ${{ steps.run.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: run
        uses: ./.github/actions/clang-tidy

