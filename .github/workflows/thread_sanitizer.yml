# Workflow configuration for S-CORE CI - Bazel Build & Test communication module
# This workflow runs Bazel test with enabled thread sanitizer when triggered by specific pull request events.

name: Test communication module with thread sanitizer
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      recreate_cache:
        description: "Recreate caches from scratch (nightly). Skips restore, saves new cache."
        required: false
        type: boolean
        default: false
      recreate_cache_mode:
        description: "Nightly cache mode: recreate (first job, no restore) or recreate-update (subsequent, restores repo from previous)"
        required: false
        type: string
        default: "recreate"
concurrency:
  group: thread_sanitizer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build_and_test_tsan:
    uses: ./.github/workflows/bazel_build_and_test.yml
    with:
      job-name: build_and_test_tsan
      disk-cache-name: build_and_test_tsan
      commands: "bazel test --config=tsan //... --build_tests_only"
      recreate_cache: ${{ inputs.recreate_cache || false }}
      recreate_cache_mode: ${{ inputs.recreate_cache_mode || 'recreate' }}
    permissions:
      contents: read
      actions: write
