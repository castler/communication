# Workflow configuration for S-CORE CI - Bazel Build & Test communication module
# This workflow runs Bazel test with enabled thread sanitizer when triggered by specific pull request events.

name: Test communication module with thread sanitizer
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      recreate_cache:
        description: "Recreate caches from scratch (nightly). Skips restore, saves new cache."
        required: false
        type: boolean
        default: false
      recreate_cache_mode:
        description: "Nightly cache mode: recreate (first job, no restore) or recreate-update (subsequent, restores repo from previous)"
        required: false
        type: string
        default: "recreate"
concurrency:
  group: thread_sanitizer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CACHE_MODE: >-
    ${{
      inputs.recreate_cache == true && inputs.recreate_cache_mode ||
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'read-only' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'update-disk' ||
      'disabled'
    }}
jobs:
    build_and_test_tsan:
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        actions: write
      steps:
        - name: Checkout repository
          uses: actions/checkout@v6.0.2
        - name: Free Disk Space (Ubuntu)
          uses: eclipse-score/more-disk-space@v1
          with:
            level: 4
        - name: Restore Bazel caches
          uses: ./.github/actions/bazel-cache-restore
          with:
            mode: ${{ env.CACHE_MODE }}
            disk-cache-name: build_and_test_tsan
        - name: Allow linux-sandbox
          uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@f89865691445b60e9229c36adb1c37b675e1ca85
        - name: Bazel test communication targets with thread sanitizer
          run: |
            bazel test --config=tsan //... --build_tests_only
        - name: Save Bazel caches
          if: always()
          uses: ./.github/actions/bazel-cache-save
          with:
            mode: ${{ env.CACHE_MODE }}
            disk-cache-name: build_and_test_tsan
