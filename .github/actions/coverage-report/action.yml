name: "Coverage Report"
description: >
  Runs C++ unit tests with coverage, generates an HTML report, and uploads
  the archive as an artifact.

inputs:
  cache-mode:
    description: "Cache mode override (empty = auto-compute from event context)."
    default: ""

outputs:
  artifact-name:
    description: "Name of the coverage report artifact"
    value: ${{ steps.set-artifact-name.outputs.artifact-name }}
  conclusion:
    description: "Job conclusion: success or failure"
    value: ${{ steps.set-conclusion.outputs.conclusion }}

runs:
  using: "composite"
  steps:
    - name: Run coverage and generate report
      id: run-coverage
      uses: ./.github/actions/00_infrastructure/bazel_job
      with:
        disk-cache: coverage_report
        cache-mode: ${{ inputs.cache-mode }}
        commands: |
          bazel coverage //... --build_tests_only
          bazel run //quality/coverage:generate_coverage_html -- \
            --archive "${{ github.event.repository.name }}_coverage_report_${{ github.sha }}" \
            cpp_coverage

    - name: Set conclusion
      id: set-conclusion
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.run-coverage.outcome }}" == "success" ]]; then
          echo "conclusion=success" >> $GITHUB_OUTPUT
        else
          echo "conclusion=failure" >> $GITHUB_OUTPUT
        fi

    - name: Set artifact name
      id: set-artifact-name
      if: steps.run-coverage.outcome == 'success'
      shell: bash
      run: |
        echo "artifact-name=${{ github.event.repository.name }}_coverage_report_${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Upload coverage artifacts
      if: steps.run-coverage.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.set-artifact-name.outputs.artifact-name }}
        path: ${{ github.event.repository.name }}_coverage_report_${{ github.sha }}.zip
