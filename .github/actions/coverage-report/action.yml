name: "Coverage Report"
description: >
  Runs C++ unit tests with coverage, generates an HTML report, and uploads
  the archive as an artifact.

inputs:
  cache-mode:
    description: "Cache mode override (empty = auto-compute from event context)."
    default: ""

outputs:
  artifact-name:
    description: "Name of the coverage report artifact"
    value: ${{ steps.set-artifact-name.outputs.artifact-name }}
  conclusion:
    description: "Job conclusion: success or failure"
    value: ${{ steps.set-conclusion.outputs.conclusion }}

runs:
  using: "composite"
  steps:
    - name: Set environment and compute cache mode
      shell: bash
      run: |
        echo "ANDROID_HOME=" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"
        echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> "$GITHUB_ENV"

        if [[ -n "${{ inputs.cache-mode }}" ]]; then
          MODE="${{ inputs.cache-mode }}"
        elif [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "merge_group" ]]; then
          MODE="read-only"
        elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          MODE="update-disk"
        else
          MODE="disabled"
        fi
        echo "CACHE_MODE=${MODE}" >> "$GITHUB_ENV"
        echo "Cache mode: ${MODE}"

    - name: Free Disk Space (Ubuntu)
      uses: eclipse-score/more-disk-space@v1
      with:
        level: 4

    - name: Restore Bazel caches
      uses: ./.github/actions/bazel-cache-restore
      with:
        mode: ${{ env.CACHE_MODE }}
        disk-cache-name: coverage_report

    - name: Allow linux-sandbox
      uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@f89865691445b60e9229c36adb1c37b675e1ca85

    - name: Run Unit Test with Coverage for C++
      id: run-coverage
      shell: bash
      run: |
        bazel coverage //... --build_tests_only

    - name: Generate HTML Coverage Report and Create Archive
      if: steps.run-coverage.outcome == 'success'
      shell: bash
      run: |
        bazel run //quality/coverage:generate_coverage_html -- \
          --archive "${{ github.event.repository.name }}_coverage_report_${{ github.sha }}" \
          cpp_coverage

    - name: Set conclusion
      id: set-conclusion
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.run-coverage.outcome }}" == "success" ]]; then
          echo "conclusion=success" >> $GITHUB_OUTPUT
        else
          echo "conclusion=failure" >> $GITHUB_OUTPUT
        fi

    - name: Set artifact name
      id: set-artifact-name
      if: steps.run-coverage.outcome == 'success'
      shell: bash
      run: |
        echo "artifact-name=${{ github.event.repository.name }}_coverage_report_${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Upload coverage artifacts
      if: steps.run-coverage.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.set-artifact-name.outputs.artifact-name }}
        path: ${{ github.event.repository.name }}_coverage_report_${{ github.sha }}.zip

    - name: Save Bazel caches
      if: always()
      uses: ./.github/actions/bazel-cache-save
      with:
        mode: ${{ env.CACHE_MODE }}
        disk-cache-name: coverage_report
