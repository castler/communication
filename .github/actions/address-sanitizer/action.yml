name: "Address / UB / Leak Sanitizer"
description: "Runs all tests with --config=asan_ubsan_lsan to detect memory errors, undefined behavior, and leaks."

inputs:
  recreate-cache:
    description: "Set to 'true' for nightly cache recreation."
    default: "false"
  recreate-cache-mode:
    description: "Nightly mode: recreate or recreate-update."
    default: "recreate"

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/bazel-job
      with:
        disk-cache: build_and_test_asan_ubsan_lsan
        recreate-cache: ${{ inputs.recreate-cache }}
        recreate-cache-mode: ${{ inputs.recreate-cache-mode }}
        commands: "bazel test --config=asan_ubsan_lsan //... --build_tests_only"
