name: "Build & Test (Host)"
description: "Builds all targets, runs all tests, and verifies the examples project."

inputs:
  recreate-cache:
    description: "Set to 'true' for nightly cache recreation."
    default: "false"
  recreate-cache-mode:
    description: "Nightly mode: recreate or recreate-update."
    default: "recreate"

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/bazel-job
      with:
        disk-cache: build_and_test_host
        recreate-cache: ${{ inputs.recreate-cache }}
        recreate-cache-mode: ${{ inputs.recreate-cache-mode }}
        commands: |
          bazel build //...
          bazel test //... --build_tests_only
          cd examples && bazel build //... && bazel mod deps --lockfile_mode=update
