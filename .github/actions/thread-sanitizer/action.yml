name: "Thread Sanitizer"
description: "Runs all tests with --config=tsan to detect data races."

inputs:
  cache-mode:
    description: "Cache mode override (empty = auto-compute from event context)."
    default: ""
  disk-cache:
    description: "Disk cache name."
    default: "build_and_test_tsan"
  fetch-only:
    description: "When true, runs --nobuild to fetch dependencies only."
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/00_infrastructure/bazel_job
      with:
        disk-cache: ${{ inputs.disk-cache }}
        cache-mode: ${{ inputs.cache-mode }}

    - name: Run tests with thread sanitizer
      if: inputs.fetch-only != 'true'
      shell: bash
      run: bazel test --config=tsan //... --build_tests_only

    - name: Fetch dependencies (--nobuild)
      if: inputs.fetch-only == 'true'
      shell: bash
      run: bazel build --nobuild --config=tsan //...
