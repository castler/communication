name: "Bazel Job Setup & Run"
description: >
  Sets up the runner (env, disk space, Bazel cache, sandbox) and runs a list of
  shell commands. The calling workflow must checkout the repository before
  using this action (required for local composite actions).

  Computes the cache mode automatically from the GitHub event context and
  optional recreate inputs. Sets ANDROID_HOME, ANDROID_SDK_ROOT, and
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 environment variables.

inputs:
  disk-cache:
    description: "Name of the Bazel disk cache to use."
    required: true
  cache-mode:
    description: >
      Cache mode override. If empty (default), auto-computed from event context:
      PR/merge_group → read-only, push to main → update-disk, otherwise → disabled.
      Explicit values: recreate, recreate-update, read-only, update-disk, disabled.
    required: false
    default: ""
  commands:
    description: >
      Newline-separated list of shell commands to execute after setup.
      Each non-empty line is run as a separate command.
      Leave empty to only perform setup (useful when subsequent workflow steps
      need step IDs or conditional logic).
    required: false
    default: ""
  max-retries:
    description: >
      Maximum number of attempts for the commands block. If a command fails,
      the entire block is retried from the beginning up to this many times.
      Default is 1 (no retry).
    required: false
    default: "1"
  fetch-only:
    description: >
      When 'true', adds --nobuild to all bazel commands via .bazelrc.
      This runs loading and analysis (triggering repository fetches) but
      skips actual compilation. Useful for populating the repository cache.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set environment and compute cache mode
      shell: bash
      run: |
        echo "ANDROID_HOME=" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"
        echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> "$GITHUB_ENV"

        if [[ -n "${{ inputs.cache-mode }}" ]]; then
          MODE="${{ inputs.cache-mode }}"
        elif [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_target" || "${{ github.event_name }}" == "merge_group" ]]; then
          MODE="read-only"
        elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          MODE="update-disk"
        else
          MODE="disabled"
        fi
        echo "CACHE_MODE=${MODE}" >> "$GITHUB_ENV"
        echo "Cache mode: ${MODE}"

    - name: Enable fetch-only mode (--nobuild)
      if: inputs.fetch-only == 'true'
      shell: bash
      run: |
        echo "BAZEL_JOB_FETCH_ONLY=true" >> "$GITHUB_ENV"
        echo "Fetch-only mode enabled: bazel commands will use --nobuild"

    - name: Free Disk Space (Ubuntu)
      uses: eclipse-score/more-disk-space@v1
      with:
        level: 4

    - name: Restore Bazel caches
      uses: ./.github/actions/00_infrastructure/bazel_cache_restore
      with:
        mode: ${{ env.CACHE_MODE }}
        disk-cache-name: ${{ inputs.disk-cache }}

    - name: Allow linux-sandbox
      uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@f89865691445b60e9229c36adb1c37b675e1ca85

    - name: Run commands
      if: inputs.commands != ''
      shell: bash
      run: |
        set -uo pipefail
        MAX_RETRIES="${{ inputs.max-retries }}"
        MAX_RETRIES="${MAX_RETRIES:-1}"
        for attempt in $(seq 1 "$MAX_RETRIES"); do
          echo "::group::Attempt ${attempt}/${MAX_RETRIES}"
          FAILED=false
          accumulated=""
          while IFS= read -r line; do
            # skip blank lines and comments
            [[ -z "$line" || "$line" == \#* ]] && continue
            # handle line continuations (trailing \)
            if [[ "$line" == *'\' ]]; then
              accumulated+="${line%\\} "
              continue
            fi
            cmd="${accumulated}${line}"
            accumulated=""
            # In fetch-only mode: convert 'bazel test' to 'bazel build' and add --nobuild
            if [[ "${BAZEL_JOB_FETCH_ONLY:-}" == "true" ]]; then
              cmd="${cmd/bazel test/bazel build}"
              cmd="${cmd/bazel coverage/bazel build}"
              cmd="${cmd/bazel run/bazel build}"
              # Add --nobuild after 'bazel build' if not already present
              if [[ "$cmd" == *"bazel build"* && "$cmd" != *"--nobuild"* ]]; then
                cmd="${cmd/bazel build/bazel build --nobuild}"
              fi
            fi
            echo "$ $cmd"
            if ! eval "$cmd"; then
              FAILED=true
              break
            fi
          done <<'COMMANDS'
        ${{ inputs.commands }}
        COMMANDS
          echo "::endgroup::"
          if [[ "$FAILED" == "false" ]]; then
            echo "Commands succeeded on attempt ${attempt}."
            exit 0
          fi
          if [[ "$attempt" -lt "$MAX_RETRIES" ]]; then
            echo "::warning::Attempt ${attempt} failed, retrying..."
          else
            echo "::error::All ${MAX_RETRIES} attempts failed."
            exit 1
          fi
        done

    - name: Save Bazel caches
      if: always()
      uses: ./.github/actions/00_infrastructure/bazel_cache_save
      with:
        mode: ${{ env.CACHE_MODE }}
        disk-cache-name: ${{ inputs.disk-cache }}

